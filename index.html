<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222222">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<title>My Fit Mini</title>
</head>
<body>
<main class="wrap">
<div class="eyebrow">My Fit Mini</div>
<h1 class="title">Lịch tập của bạn</h1>

<div class="resume-banner" id="resume-banner">
  <p>Bạn đang có buổi tập dở. Tiếp tục hay bỏ buổi tập này?</p>
  <div class="resume-actions">
    <button type="button" class="resume-continue" id="resume-continue-btn">Tiếp tục tập</button>
    <button type="button" class="resume-discard" id="resume-discard-btn">Bỏ buổi tập</button>
  </div>
</div>

<div class="tabs">
<button type="button" class="tab active" data-workout-id="a">T2 · 🍑</button>
<button type="button" class="tab" data-workout-id="b">T4 · 💪</button>
<button type="button" class="tab" data-workout-id="c">T6 · 🍑</button>
</div>

<section class="hero">
  <div class="small">BUỔI ĐANG CHỌN</div>
  <h2 id="hero-title"></h2>
  <p id="hero-meta"></p>
  <button type="button" class="start" id="start-workout-btn">Bắt đầu tập</button>
</section>

<div class="section">Lịch tuần</div>
<div class="week" id="week-calendar"></div>

<div class="section">Bài tập</div>
<div id="exercise-list"></div>

<div class="section">Lịch sử tập</div>
<div id="history-list"></div>
</main>

<div class="overlay" id="detail-overlay">
  <div class="modal">
    <button type="button" class="closex" id="detail-close-btn">×</button>
    <div id="dprog" class="progress"></div>
    <img id="dimage" class="modal-image" alt="" style="display:none">
    <h2 id="dname"></h2>
    <div id="dmeta" class="meta"></div>
    <div id="dinstructions" class="note"></div>
    <div id="dnote" class="note"></div>
    <button type="button" class="btn" id="detail-start-btn">Tập bài này</button>
  </div>
</div>

<div class="overlay" id="edit-overlay">
  <div class="modal">
    <button type="button" class="closex" id="edit-close-btn">×</button>
    <h2>Sửa bài tập</h2>
    <form id="edit-form">
      <div class="form-group"><label>Tên bài</label><input name="name" required></div>
      <div class="form-group"><label>Hướng dẫn</label><textarea name="instructions" rows="5"></textarea></div>
      <div class="form-group"><label>Chú ý</label><textarea name="notes" rows="4"></textarea></div>
      <div class="form-group">
        <label>Ảnh minh họa</label>
        <div class="image-picker">
          <img class="image-preview" data-role="preview" alt="" style="display:none">
          <input name="imageFile" type="file" accept="image/*" class="file-input">
          <button type="button" class="btn-secondary image-pick-btn" data-role="pick">Chọn ảnh từ thiết bị</button>
          <input name="image" type="url" placeholder="Hoặc dán URL ảnh (tùy chọn)">
          <button type="button" class="btn-secondary image-clear-btn" data-role="clear">Xóa ảnh</button>
        </div>
      </div>
      <div class="form-group"><label>Số set</label><input name="sets" type="number" min="1" required></div>
      <div class="form-group"><label>Số reps</label><input name="reps" type="number" min="1" required></div>
      <div class="form-group"><label>Mức kháng lực</label><input name="resistance" type="number" min="0" step="0.5"></div>
      <div class="form-group">
        <label>Loại kháng lực</label>
        <select name="resistanceType">
          <option value="kg">kg</option>
          <option value="band">band</option>
          <option value="bodyweight">bodyweight</option>
        </select>
      </div>
      <button type="submit" class="btn">Lưu thay đổi</button>
    </form>
  </div>
</div>

<div class="overlay" id="replace-overlay">
  <div class="modal">
    <button type="button" class="closex" id="replace-close-btn">×</button>
    <h2>Thay bài</h2>
    <form id="replace-form">
      <div class="form-group"><label>Tên bài mới</label><input name="name" required></div>
      <div class="form-group"><label>Hướng dẫn mới</label><textarea name="instructions" rows="5"></textarea></div>
      <div class="form-group"><label>Chú ý mới</label><textarea name="notes" rows="4"></textarea></div>
      <div class="form-group">
        <label>Ảnh mới</label>
        <div class="image-picker">
          <img class="image-preview" data-role="preview" alt="" style="display:none">
          <input name="imageFile" type="file" accept="image/*" class="file-input">
          <button type="button" class="btn-secondary image-pick-btn" data-role="pick">Chọn ảnh từ thiết bị</button>
          <input name="image" type="url" placeholder="Hoặc dán URL ảnh (tùy chọn)">
          <button type="button" class="btn-secondary image-clear-btn" data-role="clear">Xóa ảnh</button>
        </div>
      </div>
      <div class="form-group"><label>Số set</label><input name="sets" type="number" min="1" required></div>
      <div class="form-group"><label>Số reps</label><input name="reps" type="number" min="1" required></div>
      <div class="form-group"><label>Mức kháng lực</label><input name="resistance" type="number" min="0" step="0.5"></div>
      <div class="form-group">
        <label>Loại kháng lực</label>
        <select name="resistanceType">
          <option value="kg">kg</option>
          <option value="band">band</option>
          <option value="bodyweight">bodyweight</option>
        </select>
      </div>
      <button type="submit" class="btn">Thay bài</button>
    </form>
  </div>
</div>

<div class="overlay" id="history-detail-overlay">
  <div class="modal">
    <button type="button" class="closex" id="history-detail-close-btn">×</button>
    <div id="history-detail-content"></div>
  </div>
</div>

<div class="workout" id="workout-overlay">
  <div class="workout-inner">
    <button type="button" class="closex" id="workout-close-btn">×</button>
    <div id="wprog" class="progress"></div>
    <img id="wimage" class="workout-image" alt="" style="display:none">
    <h2 id="wname"></h2>
    <div id="wmeta" class="meta"></div>
    <div id="wset-display" class="set-display"></div>
    <div id="wreps-display" class="reps-display"></div>
    <div id="wset" class="note"></div>
    <button type="button" class="complete" id="complete-set-btn">Hoàn thành SET</button>
    <button type="button" class="btn-secondary" id="complete-exercise-btn">Hoàn thành bài tập</button>
  </div>
</div>

<div class="rest-screen" id="rest-overlay">
  <div class="rest-inner">
    <div id="rest-label" class="rest-label"></div>
    <div id="rest-timer" class="rest-timer">01:00</div>
    <div class="rest-actions">
      <button type="button" class="rest-skip" id="rest-skip-btn">Bỏ qua</button>
      <button type="button" class="rest-add" id="rest-add-btn">+15 giây</button>
    </div>
  </div>
</div>

<div class="completion-screen" id="completion-overlay">
  <div class="completion-inner">
    <h2>🎉 Workout hoàn thành</h2>
    <div id="completion-stats" class="completion-stats"></div>
    <button type="button" class="start" id="completion-home-btn">Quay về trang chính</button>
  </div>
</div>

<script src="data.js"></script>
<script src="images.js"></script>
<script src="app.js"></script>
</body>
</html>
